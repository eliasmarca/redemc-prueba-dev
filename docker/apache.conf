ServerName localhost
ServerTokens Prod
TraceEnable Off
DirectoryIndex index.php

<Directory "/var/www/html">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# El padre deja entrar. AuthMerging Off hace que este Require reemplace al de arriba.
<Directory "/var/www/html/includes">
    AuthMerging Off
    Require all denied
</Directory>

<Directory "/var/www/html/sql">
    AuthMerging Off
    Require all denied
</Directory>

<Directory "/var/www/html/docker">
    AuthMerging Off
    Require all denied
</Directory>

<FilesMatch "\.(sql|md|sh)$">
    Require all denied
</FilesMatch>
